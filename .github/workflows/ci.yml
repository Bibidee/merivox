name: Merivox CI

on:
  push:
    branches: [main, 'remediation/**']
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run preflight

  contract:
    runs-on: ubuntu-latest
    env:
      # Pin the official GenVM manager release used by the Direct Mode loader.
      # genlayer-test 0.30.0rc2 resolves the runner bundle from this project.
      GENVM_VERSION: v0.6.0-rc3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: python -m pytest -q tests/test_contract_static.py tests/test_contract_direct.py tests/test_cross_contract.py
